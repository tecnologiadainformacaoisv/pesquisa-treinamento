<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pesquisas de Treinamento ISV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,500&display=swap">
<style>
/* Layout: coluna única de leitura (720px) sobre branco, como os slides do relatório ISV:
   título serifado azul-marinho, rótulos pequenos em cobre, cartões creme com barra superior colorida. */
:root{
  --bg:#ffffff; --surface:#faf8f4; --line:#e6e2d8; --ink:#1a1f2e; --ink2:#4a5366; --muted:#6f7a90;
  --navy:#002060; --copper:#b36a2c; --green:#2ab251; --blue:#094c84; --teal:#0f4c5c;
  --ok:#4a7c59; --bad:#b94545; --on-navy:#ffffff; --track:#ece8de; --chip:#ffffff;
  --serif:Cambria,"Source Serif 4",Georgia,serif;
  --sans:Calibri,Carlito,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141f; --surface:#1a2030; --line:#2e3649; --ink:#eceef3; --ink2:#bcc3d1; --muted:#8f99ad;
  --navy:#cadcfc; --copper:#dc9a60; --green:#3cc765; --blue:#5aa2dc; --teal:#5fb0c2;
  --ok:#7fb48f; --bad:#e07a7a; --on-navy:#10141f; --track:#262d3f; --chip:#ffffff; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10141f; --surface:#1a2030; --line:#2e3649; --ink:#eceef3; --ink2:#bcc3d1; --muted:#8f99ad;
  --navy:#cadcfc; --copper:#dc9a60; --green:#3cc765; --blue:#5aa2dc; --teal:#5fb0c2;
  --ok:#7fb48f; --bad:#e07a7a; --on-navy:#10141f; --track:#262d3f; --chip:#ffffff; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;
  border-top:6px solid var(--green)}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:980px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{background:var(--chip);border-radius:10px;padding:6px 10px;display:inline-flex;border:0;cursor:pointer}
.logo svg{height:46px;width:auto;display:block}
.toplinks{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);margin:0}
h1,h2,h3{font-family:var(--serif);color:var(--navy);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(30px,6vw,44px);font-weight:700}
h1 em{display:block;font-weight:500}
h2{font-size:26px}
h3{font-size:19px}
p{margin:0}
.lead{color:var(--ink2);max-width:62ch}
.rule{height:3px;width:160px;background:var(--copper);border:0;margin:0}

/* hero */
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding-block:8px 120px}
.shapes{position:absolute;right:0;bottom:0;width:230px;height:104px;pointer-events:none}
.shapes i{position:absolute;display:block}
.shapes .a{left:0;bottom:0;width:104px;height:104px;border-radius:104px 0 0 0;background:var(--green)}
.shapes .b{left:92px;bottom:0;width:104px;height:104px;border-radius:50%;
  background:linear-gradient(90deg,var(--blue) 50%,var(--green) 50%)}
.shapes .c{right:0;bottom:0;width:52px;height:104px;border-radius:0 0 0 0;background:var(--navy);opacity:.9;
  border-top-left-radius:52px;border-bottom-left-radius:52px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:4px;
  padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.c2{border-top-color:var(--copper)}
.card p{color:var(--ink2)}
.card .btn{margin-top:auto;align-self:flex-start}

.btn{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--navy);background:var(--navy);color:var(--on-navy);
  padding:11px 22px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}

/* form */
.progress{display:flex;flex-direction:column;gap:6px}
.progress .bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress .bar i{transition:none}}
form{display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:8px;border:0;padding:0;margin:0;min-width:0}
.field>label,.field>legend{font-weight:700;color:var(--ink);padding:0}
.field legend{margin-bottom:8px}
.opt{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:8px;padding:12px 14px;width:100%}
textarea{min-height:110px;resize:vertical}
input[type=number]{max-width:160px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.choice{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;
  background:var(--bg);min-height:50px}
.choice input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin:0}
.choice:has(input:checked){border-color:var(--blue);background:var(--surface);font-weight:700}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale label{flex:1 1 52px;display:flex;align-items:center;justify-content:center;min-height:52px;border:1.5px solid var(--line);
  border-radius:8px;cursor:pointer;font-weight:700;font-size:19px;position:relative;background:var(--bg)}
.scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scale label:has(input:checked){background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.scale label:has(input:focus-visible){outline:3px solid var(--copper);outline-offset:2px}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:15px;font-weight:700}
.field.bad input[type=text],.field.bad input[type=number],.field.bad textarea{border-color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{background:var(--surface);border-left:4px solid var(--copper);padding:12px 16px;color:var(--ink2);font-size:15.5px}
.field.key{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--copper);border-radius:4px;padding:18px}
.field.key>label{font-family:var(--serif);font-size:21px;color:var(--navy)}
.field.key textarea{min-height:160px}
.why{color:var(--ink2)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:120px;word-break:break-all}

/* painel */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:999px;
  padding:8px 16px;cursor:pointer;min-height:42px}
.tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:4px;padding:16px;min-width:0}
.kpi:nth-child(2){border-top-color:var(--ok)}.kpi:nth-child(3){border-top-color:var(--blue)}.kpi:nth-child(4){border-top-color:var(--copper)}
.kpi b{display:block;font-family:var(--serif);font-size:38px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.q{display:flex;flex-direction:column;gap:10px;padding-block:18px;border-top:1px solid var(--line);min-width:0}
.q h3{font-family:var(--sans);font-size:17px;color:var(--ink)}
.q .meta{color:var(--muted);font-size:14px}
.bars{display:grid;grid-template-columns:minmax(120px,240px) 1fr auto;gap:6px 12px;align-items:center}
.bars .lab{font-size:15px;color:var(--ink2);min-width:0}
.bars .trk{height:18px;background:var(--track);border-radius:2px;overflow:hidden}
.bars .trk i{display:block;height:100%;background:var(--teal)}
.bars .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:520px){.bars{grid-template-columns:1fr auto}.bars .lab{grid-column:1/-1;margin-top:4px}}
.quotes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.quotes li{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-style:italic;color:var(--ink2);
  overflow-wrap:anywhere}
.quotes small{display:block;font-style:normal;color:var(--muted);font-size:13px}
details.resp{border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
details.resp summary{cursor:pointer;padding:12px 14px;font-weight:700;overflow-wrap:anywhere}
details.resp dl{margin:0;padding:0 14px 14px;display:grid;gap:8px}
details.resp dt{font-size:13px;color:var(--muted)}
details.resp dd{margin:0;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:4px;padding:28px 20px;text-align:center;color:var(--ink2)}
footer a{color:inherit}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.stack{display:flex;flex-direction:column;gap:14px}
</style>

</head>

<script>
(function(){
"use strict";
var SN=["Sim","Não"];
var SOFT=["Comunicação","Trabalho em equipe","Gestão do tempo","Proatividade","Relacionamento interpessoal"];
var SURVEYS={
 est:{
  nome:"Aprendizes", titulo:"Pesquisa de Perfil e", titulo2:"Necessidades de Desenvolvimento",
  sub:"Direcionada aos aprendizes",
  intro:"Esta pesquisa tem como objetivo conhecer melhor o perfil acadêmico dos aprendizes e identificar temas em que você sente dificuldade, para que o Setor de Educação Permanente possa oferecer treinamentos que contribuam com o seu desempenho no trabalho. Não é necessário se identificar, caso prefira responder anonimamente.",

  steps:[

 },
 coord:{

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pct(R,id,v){var n=R.filter(function(x){return x.r[id]!=null&&x.r[id]!=="";}).length;if(!n)return "—";
  return Math.round(100*R.filter(function(x){return x.r[id]===v;}).length/n)+"%";}
function avg(R,id){var v=R.map(function(x){return Number(x.r[id]);}).filter(function(n){return n>0;});if(!v.length)return "—";
  return (v.reduce(function(a,b){return a+b;},0)/v.length).toFixed(1).replace(".",",");}
function sum(R,id){return R.reduce(function(a,x){return a+(Number(x.r[id])||0);},0);}
function fields(key){var out=[];SURVEYS[key].steps.forEach(function(s){s.f.forEach(function(f){out.push(f);});});return out;}
function qLabel(f){return (f.n?f.n+". ":"")+f.label;}
function fmtDate(ts){try{return new Date(ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});}catch(e){return ts||"";}}

var API_URL="https://script.google.com/macros/s/AKfycbwWWiFfz46qE-Vym8pT4gQMrwkGrGPAMSOCuN_UvqwP2JtYpiyNCWdHQfyahu7wpG3amA/exec";
function configured(){return /^https:\/\/script\.google\.com\//.test(API_URL);}
async function api(body){
  if(!configured())throw new Error("config");
  var res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow"});
  var j=await res.json();
  if(!j||!j.ok)throw new Error((j&&j.erro)||"falha");
  return j;
}
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "r-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12);
}

/* ---------- formulário ---------- */
function visible(f){return !f.showIf||S.ans[f.showIf[0]]===f.showIf[1];}
function fieldHTML(f){
  var v=S.ans[f.id],id="f_"+f.id,h="";
  var tag=(f.hint?' <span class="opt">('+esc(f.hint)+')</span>':'')+((f.req||f.destaque)?'':' <span class="opt">— opcional</span>');
  var lab=esc(qLabel(f))+tag;
  if(f.type==="text"||f.type==="number"||f.type==="textarea"){
    h='<div class="field'+(f.destaque?' key':'')+'" data-f="'+f.id+'">'+(f.destaque?'<p class="eyebrow">Pergunta mais importante</p>':'')+'<label for="'+id+'">'+lab+'</label>'+(f.destaque?'<p class="why">'+esc(f.destaque)+'</p>':'');
    if(f.type==="textarea")h+='<textarea id="'+id+'" maxlength="2000">'+esc(v)+'</textarea>';
    else if(f.type==="number")h+='<input id="'+id+'" type="number" min="0" step="1" inputmode="numeric" value="'+esc(v)+'">';
    else h+='<input id="'+id+'" type="text" maxlength="200" value="'+esc(v)+'">';
    return h+'<span class="err" hidden></span></div>';
  }
  h='<fieldset class="field" data-f="'+f.id+'"><legend>'+lab+'</legend>';
  if(f.type==="scale"){
    h+='<div class="scale">';
    for(var i=1;i<=5;i++)h+='<label><input type="radio" name="'+id+'" id="'+id+'_'+i+'" value="'+i+'"'+(Number(v)===i?" checked":"")+'>'+i+'</label>';
    h+='</div><div class="legend"><span>'+esc(f.lo)+'</span><span>'+esc(f.hi)+'</span></div>';
  }else{
    var multi=f.type==="multi",arr=multi?(v||[]):[v];
    h+='<div class="choices">';

    opts.forEach(function(o,i){
      h+='<label class="choice"><input type="'+(multi?"checkbox":"radio")+'" name="'+id+'" id="'+id+'_'+i+'" value="'+esc(o)+'"'+(arr.indexOf(o)>=0?" checked":"")+'><span>'+esc(o)+'</span></label>';
    });

function collect(){
  SURVEYS[S.key].steps[S.step].f.forEach(function(f){
    var id="f_"+f.id;
    if(f.type==="text"||f.type==="textarea")S.ans[f.id]=$("#"+id).value.trim();
    else if(f.type==="number"){var t=$("#"+id).value.trim();S.ans[f.id]=t===""?"":Number(t);}
    else if(f.type==="multi"){
      S.ans[f.id]=Array.prototype.map.call(document.querySelectorAll('input[name="'+id+'"]:checked'),function(e){return e.value;});
      if(f.other)S.ans[f.id+"_outro"]=S.ans[f.id].indexOf("Outro")>=0?$("#"+id+"_outro").value.trim():"";
    }else{var c=document.querySelector('input[name="'+id+'"]:checked');S.ans[f.id]=c?(f.type==="scale"?Number(c.value):c.value):"";}
  });
}
function applyVisibility(){
  SURVEYS[S.key].steps[S.step].f.forEach(function(f){
    var el=document.querySelector('[data-f="'+f.id+'"]');if(!el)return;
    el.hidden=!visible(f);
    if(f.other){var o=$("#f_"+f.id+"_outro"),on=(S.ans[f.id]||[]).indexOf("Outro")>=0;o.hidden=!on;}
  });
}
function validate(){
  var first=null;
  SURVEYS[S.key].steps[S.step].f.forEach(function(f){
    var el=document.querySelector('[data-f="'+f.id+'"]'),err=el.querySelector(".err"),v=S.ans[f.id],msg="";
    if(visible(f)){
      var emptyV=v===""||v==null||(Array.isArray(v)&&!v.length);
      if(f.req&&emptyV)msg=f.type==="multi"?"Marque ao menos uma opção.":(f.type==="single"||f.type==="scale")?"Escolha uma opção.":"Preencha este campo.";
      else if(f.type==="number"&&v!==""&&(!Number.isInteger(v)||v<0))msg="Informe um número inteiro, a partir de 0.";
      else if(f.other&&(v||[]).indexOf("Outro")>=0&&!S.ans[f.id+"_outro"])msg="Descreva o que você marcou como “Outro”.";
    }else{ S.ans[f.id]=f.type==="multi"?[]:""; }
    err.textContent=msg;err.hidden=!msg;el.classList.toggle("bad",!!msg);
    if(msg&&!first)first=el;
  });
  if(first){first.scrollIntoView({block:"center",behavior:"auto"});var i=first.querySelector("input,textarea");if(i)i.focus({preventScroll:true});}
  return !first;
}
async function submit(){

    S.sending=false;go("done",{ans:{},step:0,docId:null});
  }catch(e){
    S.sending=false;b.disabled=false;b.textContent="Enviar respostas";
    err.textContent=e.message==="config"?"A pesquisa ainda não foi ligada à planilha. Avise o Setor de Educação Permanente.":
      "Não foi possível enviar. Verifique sua conexão e toque em “Enviar respostas” de novo; o que você preencheu continua aqui.";

  }
}

async function loadAll(){
  if(S.loading)return;
  S.loading=true;S.loadErr="";S.loginErr="";renderIfPainel();
  try{
    var j=await api({acao:"listar",senha:senha});
    S.rows=(j.respostas||[]).filter(function(x){return x&&SURVEYS[x.s]&&x.r;}).sort(function(a,b){return a.ts<b.ts?1:-1;});
    S.loaded=true;
  }catch(e){
    if(e.message==="senha"){setSenha("");S.loaded=false;S.loginErr="Senha incorreta.";}
    else if(e.message==="bloqueado"){setSenha("");S.loaded=false;S.loginErr="Muitas tentativas incorretas. Aguarde 15 minutos e tente de novo.";}
    else S.loadErr=e.message==="config"?"O painel ainda não foi ligado à planilha (falta a URL do Apps Script no index.html).":"Não foi possível carregar as respostas. Tente atualizar.";
  }
  S.loading=false;renderIfPainel();
}
function renderIfPainel(){if(S.view==="painel")renderPainel();}
function barsHTML(counts,total){
  var max=Math.max.apply(null,counts.map(function(c){return c[1];}).concat([1]));
  return '<div class="bars">'+counts.map(function(c){
    return '<span class="lab">'+esc(c[0])+'</span><span class="trk"><i style="width:'+(100*c[1]/max)+'%"></i></span>'+
     '<span class="val">'+c[1]+(total?' · '+Math.round(100*c[1]/total)+'%':'')+'</span>';}).join("")+'</div>';
}
function questionHTML(f,R){
  var vals=R.map(function(x){return x.r[f.id];});
  var answered=vals.filter(function(v){return !(v===""||v==null||(Array.isArray(v)&&!v.length));});
  var h='<section class="q"><h3>'+esc(qLabel(f))+'</h3>';
  if(!answered.length)return h+'<p class="meta">Sem respostas.</p></section>';
  if(f.type==="single"||f.type==="multi"||f.type==="scale"){
    var opts=f.type==="scale"?[1,2,3,4,5]:f.opts.concat(f.other?["Outro"]:[]);
    var counts=opts.map(function(o){return [String(o),answered.filter(function(v){return Array.isArray(v)?v.indexOf(o)>=0:v===o;}).length];});
    if(f.type==="multi")counts.sort(function(a,b){return b[1]-a[1];});
    h+='<p class="meta">'+answered.length+' resposta(s)'+(f.type==="scale"?' · média '+avg(R,f.id)+' · '+esc(f.lo)+', '+esc(f.hi):'')+'</p>'+barsHTML(counts,answered.length);
    if(f.other){var outros=R.map(function(x){return x.r[f.id+"_outro"];}).filter(Boolean);
      if(outros.length)h+='<ul class="quotes">'+outros.map(function(o){return '<li><small>Outro</small>'+esc(o)+'</li>';}).join("")+'</ul>';}
  }else if(f.type==="number"){
    h+='<p class="meta">'+answered.length+' resposta(s) · total '+sum(R,f.id)+'</p>';
  }else if(f.id==="setor"){
    var m={};answered.forEach(function(v){m[v]=(m[v]||0)+1;});
    h+=barsHTML(Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}),answered.length);
  }else if(f.id!=="nome"){
    h+='<p class="meta">'+answered.length+' resposta(s)</p><ul class="quotes">'+R.filter(function(x){return x.r[f.id];}).map(function(x){
      return '<li>'+esc(x.r[f.id])+'<small>'+esc(x.r.setor||"")+'</small></li>';}).join("")+'</ul>';
  }else return "";
  return h+'</section>';
}
function showVal(f,r){var v=r[f.id];if(Array.isArray(v)){v=v.map(function(o){return o==="Outro"&&r[f.id+"_outro"]?"Outro: "+r[f.id+"_outro"]:o;}).join("; ");}return (v===""||v==null)?"":String(v);}

  }
  if(!S.loaded&&!S.loading&&!S.loadErr){loadAll();return;}

  var sv=SURVEYS[S.tab],fs=fields(S.tab);
  var h='<div class="stack" style="gap:22px"><div class="stack" style="gap:8px"><p class="eyebrow">Painel de respostas</p><h2>'+esc(sv.titulo+" "+sv.titulo2)+'</h2></div>'+
   '<div class="toolbar"><div class="tabs" role="tablist">'+Object.keys(SURVEYS).map(function(k){
     return '<button class="tab" role="tab" type="button" data-tab="'+k+'" aria-selected="'+(k===S.tab)+'">'+esc(SURVEYS[k].nome)+' ('+S.rows.filter(function(x){return x.s===k;}).length+')</button>';}).join("")+'</div>'+
   '<div class="toplinks"><button class="btn ghost small" type="button" id="btnReload"'+(S.loading?" disabled":"")+'>'+(S.loading?"Atualizando…":"Atualizar")+'</button>'+
   (window.XLSX?'<button class="btn small" type="button" id="btnXlsx"'+(S.rows.length?"":" disabled")+'>Exportar Excel</button>':'')+
   '<button class="btn ghost small" type="button" id="btnSair">Sair</button></div></div>';
  if(S.loadErr)h+='<p class="note">'+esc(S.loadErr)+'</p>';
  if(!S.loaded)h+=S.loadErr?'':'<div class="empty">Carregando respostas…</div>';
  else if(!all.length)h+='<div class="empty"><h3>Nenhuma resposta ainda</h3><p>As respostas da pesquisa de '+esc(sv.nome.toLowerCase())+' aparecem aqui assim que forem enviadas, com gráficos por pergunta e a lista individual.</p></div>';
  else{
    h+='<div class="toolbar"><label>Setor: <select id="selSetor"><option value="">Todos</option>'+setores.map(function(s){
      return '<option'+(s===S.setor?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></label><span class="meta" style="color:var(--muted)">'+R.length+' de '+all.length+' resposta(s)</span></div>'+
     '<div class="kpis">'+sv.kpis(R).map(function(k){return '<div class="kpi"><b>'+esc(k[1])+'</b><span>'+esc(k[0])+'</span></div>';}).join("")+'</div>'+
     '<div>'+fs.map(function(f){return questionHTML(f,R);}).join("")+'</div>'+
     '<div class="stack"><h2>Respostas individuais</h2><div class="list">'+R.map(function(x){
       return '<details class="resp"><summary>'+esc(fmtDate(x.ts))+' · '+esc(x.r.setor||"sem setor")+' · '+esc(x.r.nome||"anônimo")+'</summary><dl>'+
        fs.map(function(f){var v=showVal(f,x.r);return v?'<div><dt>'+esc(qLabel(f))+'</dt><dd>'+esc(v)+'</dd></div>':"";}).join("")+
        '<div><button class="btn danger small" type="button" data-del="'+esc(x.id)+'" data-s="'+esc(x.s)+'">Excluir resposta</button></div></dl></details>';}).join("")+'</div></div>';
  }
  view.innerHTML=h+'</div>';
}
function exportXlsx(){
  var wb=XLSX.utils.book_new();
  Object.keys(SURVEYS).forEach(function(k){
    var fs=fields(k),head=["Data"].concat(fs.map(qLabel));
    var rows=S.rows.filter(function(x){return x.s===k;}).map(function(x){return [fmtDate(x.ts)].concat(fs.map(function(f){
      var v=x.r[f.id];return (f.type==="number"||f.type==="scale")&&v!==""&&v!=null?Number(v):showVal(f,x.r);}));});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head].concat(rows)),SURVEYS[k].nome);
  });
  XLSX.writeFile(wb,"pesquisas-treinamento-isv.xlsx");
}

/* ---------- eventos ---------- */
document.addEventListener("click",async function(e){
  var t=e.target.closest("button");if(!t)return;
  if(S.solo&&(t.id==="logo"||t.hasAttribute("data-home")))return go("intro",{key:S.solo,ans:{},step:0,docId:null});
  if(t.id==="logo"||t.hasAttribute("data-home")){if(location.hash)history.replaceState(null,"",location.pathname);return go("home",{ans:{},step:0,docId:null});}
  if(t.dataset.open)return go("intro",{key:t.dataset.open,ans:{},step:0,docId:null});
  if(t.hasAttribute("data-start"))return go("form",{step:0});
  if(t.hasAttribute("data-back")){collect();return S.step===0?go("intro"):go("form",{step:S.step-1});}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.setor="";return renderPainel();}
  if(t.id==="btnXlsx")return exportXlsx();
  if(t.id==="btnReload"){S.loadErr="";return loadAll();}
  if(t.id==="btnSair"){setSenha("");S.rows=[];S.loaded=false;S.loadErr="";return renderPainel();}
  if(t.dataset.del){
    if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Confirmar exclusão";return;}
    t.disabled=true;var id=t.dataset.del;
    try{await api({acao:"excluir",senha:senha,s:t.dataset.s,id:id});
      S.rows=S.rows.filter(function(x){return x.id!==id;});renderPainel();
    }catch(err){t.disabled=false;t.textContent="Não foi possível excluir";}
  }
});
document.addEventListener("change",function(e){
  if(e.target.id==="selSetor"){S.setor=e.target.value;return renderPainel();}
  if(S.view==="form"&&e.target.closest("#frm")){collect();applyVisibility();}
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="frmLogin"){var v=$("#senhaPainel").value;if(!v)return;setSenha(v);S.loaded=false;S.loadErr="";return loadAll();}
  if(e.target.id!=="frm")return;
  collect();
  if(!validate())return;
  if(S.step<SURVEYS[S.key].steps.length-1)return go("form",{step:S.step+1});
  submit();
});

/* ---------- partida ---------- */
function route(){
  var hash=(location.hash||"").replace("#","");
  S.solo=null;
  if(hash==="aprendizes"||hash==="estagiarios"){S.solo="est";go("intro",{key:"est",ans:{},step:0,docId:null});}
  else if(hash==="coordenadores"){S.solo="coord";go("intro",{key:"coord",ans:{},step:0,docId:null});}
  else go(hash==="painel"?"painel":"home");
}
window.addEventListener("hashchange",route);
route();
})();
</script>
